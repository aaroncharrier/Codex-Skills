interface:
  display_name: "Jira Updater"
  short_description: "Validate and execute Jira mutations safely"
  default_prompt: "Use $jira-updater to preview and then execute this Jira create, update, comment, attachment, or assigned-to-me request through Atlassian MCP."
dependencies:
  tools:
    - type: "mcp"
      value: "atlassian"
      description: "Atlassian MCP server for Jira metadata, queries, and mutations"
      transport: "streamable_http"
      url: "https://mcp.atlassian.com/v1/mcp"
policy:
  allow_implicit_invocation: true
